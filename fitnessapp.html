<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>RM Fitness</title>
<meta name="theme-color" content="#0f1115" />
<style>
  :root{
    --bg:#0f1115;
    --surface:#171a21;
    --surface2:#1f232c;
    --surface3:#262b36;
    --border:#2a2f3a;
    --text:#eceef2;
    --muted:#8b92a3;
    --muted2:#5c6373;
    --accent:#ff6a3d;
    --accent-dim:#3a2018;
    --good:#3ddc84;
    --danger:#ff5c5c;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}

  /* Scrollbars matching the app's dark theme instead of the OS default */
  *{scrollbar-width:thin; scrollbar-color:rgba(139,146,163,0.35) var(--bg);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:rgba(139,146,163,0.35); border-radius:999px; border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:rgba(139,146,163,0.55);}
  ::-webkit-scrollbar-button{display:none; width:0; height:0;}
  ::-webkit-scrollbar-corner{background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--bg);
  }
  button{font-family:inherit;}
  input{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- App bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 12px;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .appbar h1{
    font-size:20px; margin:0; letter-spacing:0.2px;
  }
  .appbar h1 .dot{color:var(--accent);}
  .icon-btn{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    width:38px; height:38px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--surface3);}
  .icon-btn.danger{color:var(--danger);}

  .timer-pill{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:14px;
    padding:8px 12px;
    border-radius:999px;
  }

  /* ---------- Main scroll area ---------- */
  .screen{
    flex:1;
    padding:0 16px 100px;
    overflow-y:auto;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:var(--radius);
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#1a0d06;}
  .btn-primary:active{background:#e65a2f;}
  .btn-secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .btn-secondary:active{background:var(--surface3);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px dashed var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,92,92,0.35);}
  .btn-sm{padding:8px 12px; font-size:13px; width:auto;}

  /* ---------- Home ---------- */
  .hero-cta{margin:6px 0 26px;}
  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); margin:22px 0 10px; font-weight:700;
  }
  .empty-state{
    text-align:center; color:var(--muted); padding:40px 12px;
    border:1px dashed var(--border); border-radius:var(--radius);
    font-size:14px; line-height:1.5;
  }
  .workout-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .workout-card:active{background:var(--surface2);}
  .workout-card .wc-date{font-weight:700; font-size:15px;}
  .workout-card .wc-meta{color:var(--muted); font-size:13px; margin-top:3px;}
  .workout-card .wc-del{color:var(--muted2); font-size:18px; padding:4px 8px;}

  /* ---------- Active workout ---------- */
  .block{
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--surface);
  }
  .superset-wrap{
    border-radius:var(--radius);
    margin-bottom:14px;
    border:1px solid var(--accent);
    background:var(--accent-dim);
    padding:8px;
  }
  .superset-wrap .block{margin-bottom:8px;}
  .superset-wrap .block:last-child{margin-bottom:0;}
  .superset-label{
    display:flex; align-items:center; gap:6px;
    color:var(--accent); font-weight:800; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 6px 8px;
  }
  .ex-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 14px 10px;
  }
  .ex-name{font-size:16px; font-weight:700;}
  .ex-tag{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .ex-remove{color:var(--muted2); font-size:16px; padding:2px 6px; cursor:pointer;}
  .ex-history{
    margin:0 14px 10px; padding:10px 12px;
    background:var(--surface2); border-radius:10px;
    font-size:12.5px; line-height:1.6;
  }
  .ex-history .row{display:flex; justify-content:space-between; gap:8px;}
  .ex-history .label{color:var(--muted); flex-shrink:0;}
  .ex-history .val{color:var(--text); text-align:right;}
  .ex-history .val.best{color:var(--accent); font-weight:700;}
  .ex-history.empty{color:var(--muted); text-align:center;}

  .sets-table{padding:0 14px 10px;}
  .sets-header, .set-row{
    display:grid;
    grid-template-columns:28px 1fr 1fr 34px 30px;
    gap:8px;
    align-items:center;
  }
  .sets-header{
    color:var(--muted2); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 2px 8px;
  }
  .set-row{margin-bottom:6px;}
  .set-num{
    color:var(--muted); font-weight:700; font-size:13px; text-align:center;
  }
  .set-row input{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:9px 8px;
    font-size:14.5px;
    text-align:center;
  }
  .set-row input:focus{outline:none; border-color:var(--accent);}
  .set-check{
    width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface2); border:1px solid var(--border);
    color:transparent; cursor:pointer; font-size:14px;
  }
  .set-check.done{background:rgba(61,220,132,0.15); border-color:var(--good); color:var(--good);}
  .set-del{color:var(--muted2); font-size:16px; text-align:center; cursor:pointer;}

  .add-set-btn{
    margin:4px 14px 14px;
    width:calc(100% - 28px);
  }

  .add-exercise-fab{margin:6px 0 20px;}

  /* ---------- Sticky footer ---------- */
  .footer-bar{
    position:sticky; bottom:0; z-index:15;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, var(--bg) 30%);
  }

  /* ---------- Bottom tab bar ---------- */
  .bottom-fixed{
    position:sticky; bottom:0; z-index:15;
    background:var(--bg);
    border-top:1px solid var(--border);
  }
  .start-cta{padding:12px 16px 10px;}
  .bottom-nav{
    display:flex; justify-content:center; align-items:stretch; gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; max-width:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:6px 4px; border-radius:10px;
    cursor:pointer; color:var(--muted);
  }
  .nav-item:active{background:var(--surface2);}
  .nav-icon{font-size:20px; line-height:1;}
  .nav-label{font-size:11px; font-weight:600;}
  .nav-item.active{color:var(--accent);}

  /* ---------- New exercise form ---------- */
  .search-row{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .search-row .search-box{flex:1; margin-bottom:0;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .form-field input, .form-field select{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14.5px; font-family:inherit;
  }
  .form-field input:focus, .form-field select:focus{outline:none; border-color:var(--accent);}
  .form-field select:invalid{color:var(--muted);}
  .form-field select option{color:var(--text); background:var(--surface2);}

  /* ---------- Templates ---------- */
  .template-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
  .template-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; cursor:pointer;
    aspect-ratio:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:4px;
  }
  .template-card:active{background:var(--surface2);}
  .tpl-name{font-size:15px; font-weight:700;}
  .tpl-sub{color:var(--muted); font-size:12.5px;}
  .template-card-add{
    grid-column:1 / -1; aspect-ratio:auto;
    flex-direction:row; gap:8px; padding:14px;
    border:1px dashed var(--border); background:transparent; color:var(--accent);
  }
  .template-card-add:active{background:var(--surface2);}
  .template-card-add .tpl-name{color:var(--accent);}

  /* ---------- Modal sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:50; display:flex; align-items:flex-start; justify-content:center;
    padding-top:96px;
  }
  .sheet{
    width:100%; max-width:480px;
    background:var(--bg);
    border-radius:20px;
    border:1px solid var(--border);
    height:56.25vh;
    display:flex; flex-direction:column;
    animation:slideup 0.18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
  .sheet-header{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .sheet-title-row{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .sheet-title-row h2{font-size:17px; margin:0;}
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; margin-bottom:10px;
  }
  .search-box input{
    flex:1; background:transparent; border:none; color:var(--text);
    font-size:15px;
  }
  .search-box input:focus{outline:none;}
  .search-box .sicon{color:var(--muted); font-size:15px;}
  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:7px 13px;
    border-radius:999px;
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:13px; font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--accent); color:#1a0d06; border-color:var(--accent);}
  .superset-toggle{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; margin-top:10px;
    background:var(--surface2); border:1px solid var(--border); border-radius:12px;
    cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--muted);
  }
  .superset-toggle.on{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .sw{
    width:36px; height:20px; border-radius:999px; background:var(--surface3);
    position:relative; flex-shrink:0; transition:background 0.15s;
  }
  .sw::after{
    content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
    border-radius:50%; background:var(--muted); transition:transform 0.15s;
  }
  .superset-toggle.on .sw{background:var(--accent);}
  .superset-toggle.on .sw::after{transform:translateX(16px); background:#1a0d06;}

  .ex-list{flex:1; overflow-y:auto; padding:4px 8px 8px;}
  .ex-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .ex-row:active{background:var(--surface2);}
  .ex-row.selected{background:var(--surface2);}
  .ex-row-name{font-size:15px; font-weight:600;}
  .ex-row-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .ex-row-check{
    width:24px; height:24px; border-radius:7px; flex-shrink:0;
    border:1.5px solid var(--border); background:var(--surface2);
    display:flex; align-items:center; justify-content:center; color:transparent; font-size:13px;
  }
  .ex-row-check.selected{background:var(--accent); border-color:var(--accent); color:#1a0d06;}
  .ex-row-added{
    font-size:11px; font-weight:700; color:var(--good); flex-shrink:0;
    background:rgba(61,220,132,0.12); padding:4px 8px; border-radius:999px;
  }
  .ex-empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .sheet-footer{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    flex-shrink:0;
  }

  /* confirm modal */
  .confirm-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:60; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .confirm-box{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:20px; width:100%; max-width:340px;
    animation:slideup 0.15s ease-out;
  }
  .confirm-msg{font-size:15px; line-height:1.5; margin-bottom:18px;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions .btn{flex:1;}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--surface3); color:var(--text); border:1px solid var(--border);
    padding:10px 18px; border-radius:999px; font-size:13.5px;
    z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* history detail */
  .detail-set-line{
    display:flex; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .detail-set-line:last-child{border-bottom:none;}
</style>
</head>

<div id="app"></div>

/* ==================== HISTORY LOOKUP ==================== */
// Returns {previous:[{weight,reps}], bestWeight:{weight,reps}, bestReps:{weight,reps}} for an exercise,
// based on all *finished* workouts (most recent first).
function getExerciseHistory(exerciseId){
  const finished = state.workouts.slice().sort((a,b)=> new Date(b.finishedAt) - new Date(a.finishedAt));
  let previous = null;
  let bestWeight = null; // {weight,reps}
  let bestReps = null;   // {weight,reps}

  for(const w of finished){
    const blocksWithEx = w.blocks.filter(b=>b.exerciseId===exerciseId);
    if(blocksWithEx.length===0) continue;
    const sets = [];
    blocksWithEx.forEach(b=> b.sets.forEach(s=>{
      const wt = parseFloat(s.weight), rp = parseFloat(s.reps);
      if(!isNaN(wt) && !isNaN(rp)){
        sets.push({weight:wt, reps:rp});
        if(!bestWeight || wt > bestWeight.weight) bestWeight = {weight:wt, reps:rp};
        if(!bestReps || rp > bestReps.reps) bestReps = {weight:wt, reps:rp};
      }
    }));
    if(!previous && sets.length){ previous = sets; }
  }
  return {previous, bestWeight, bestReps};
}

function fmtNum(n){
  return Number.isInteger(n) ? String(n) : String(Math.round(n*100)/100);
}

function buildHistoryBox(exerciseId){
  const hist = getExerciseHistory(exerciseId);
  if(!hist.previous) return `<div class="ex-history empty">No history yet for this exercise</div>`;
  const prevStr = hist.previous.map(s=>`${fmtNum(s.weight)}&times;${fmtNum(s.reps)}`).join(", ");
  return `
    <div class="ex-history">
      <div class="row"><span class="label">Previous</span><span class="val">${prevStr}</span></div>
      <div class="row"><span class="label">Best weight</span><span class="val best">${fmtNum(hist.bestWeight.weight)} &times; ${fmtNum(hist.bestWeight.reps)}</span></div>
      <div class="row"><span class="label">Best reps</span><span class="val best">${fmtNum(hist.bestReps.reps)} reps @ ${fmtNum(hist.bestReps.weight)}</span></div>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  if(state.route==="start") app.innerHTML = renderStart();
  else if(state.route==="history") app.innerHTML = renderHistoryTab();
  else if(state.route==="exercises") app.innerHTML = renderExercisesTab();
  else if(state.route==="exdetail") app.innerHTML = renderExerciseDetail();
  else if(state.route==="tpldetail") app.innerHTML = renderTemplateDetail();
  else if(state.route==="workout") app.innerHTML = renderWorkout();
  else if(state.route==="detail") app.innerHTML = renderDetail();

  if(state.picker.open){
    app.insertAdjacentHTML("beforeend", renderPicker());
  }
  if(state.confirm){
    app.insertAdjacentHTML("beforeend", renderConfirmModal());
  }
  if(state.newExerciseOpen){
    app.insertAdjacentHTML("beforeend", renderNewExerciseModal());
  }
  if(state.newTemplate){
    app.insertAdjacentHTML("beforeend", renderNewTemplateModal());
  }
  bindEvents();
  if(state.route==="workout" && state.active) startTimerLoop();
  else stopTimerLoop();
}

/* ==================== ACTIVE WORKOUT ==================== */
function renderWorkout(){
  const w = state.active;
  if(!w) { state.route="start"; return renderStart(); }

  // group blocks: consecutive blocks sharing supersetId are rendered together
  const groups = [];
  w.blocks.forEach(b=>{
    const last = groups[groups.length-1];
    if(b.supersetId && last && last.supersetId===b.supersetId){
      last.blocks.push(b);
    } else {
      groups.push({supersetId:b.supersetId, blocks:[b]});
    }
  });

  const blocksHtml = groups.map(g=>{
    const inner = g.blocks.map(b=>renderBlock(b)).join("");
    if(g.supersetId){
      return `<div class="superset-wrap"><div class="superset-label">&#9889; Superset</div>${inner}</div>`;
    }
    return inner;
  }).join("");

  const empty = w.blocks.length===0 ? `<div class="empty-state">No exercises added yet.<br/>Tap "Add Exercise" to get started.</div>` : "";

  return `
    <div class="appbar">
      <div class="icon-btn danger" data-action="discard-workout" title="Discard workout">&times;</div>
      <div class="timer-pill" id="workout-timer">0:00</div>
    </div>
    <div class="screen">
      ${empty}
      ${blocksHtml}
      <button class="btn btn-secondary add-exercise-fab" data-action="open-picker">+ Add Exercise</button>
    </div>
    <div class="footer-bar">
      <button class="btn btn-primary" data-action="finish-workout">Finish Workout</button>
    </div>
  `;
}

function renderBlock(b){
  const ex = findExercise(b.exerciseId);
  const histHtml = buildHistoryBox(b.exerciseId);

  const setsHtml = b.sets.map((s,i)=>`
    <div class="set-row">
      <div class="set-num">${i+1}</div>
      <input type="text" inputmode="decimal" placeholder="weight" value="${escAttr(s.weight)}"
        data-action="set-weight" data-block="${b.id}" data-set="${s.id}" />
      <input type="text" inputmode="numeric" placeholder="reps" value="${escAttr(s.reps)}"
        data-action="set-reps" data-block="${b.id}" data-set="${s.id}" />
      <div class="set-check ${s.done?'done':''}" data-action="toggle-done" data-block="${b.id}" data-set="${s.id}">&#10003;</div>
      <div class="set-del" data-action="delete-set" data-block="${b.id}" data-set="${s.id}">&times;</div>
    </div>
  `).join("");

  return `
    <div class="block">
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-tag">${ex.category} &middot; ${ex.equipment}</div>
        </div>
        <div class="ex-remove" data-action="remove-block" data-block="${b.id}">&times;</div>
      </div>
      ${histHtml}
      <div class="sets-table">
        <div class="sets-header"><div></div><div>Weight</div><div>Reps</div><div></div><div></div></div>
        ${setsHtml}
      </div>
      <button class="btn btn-ghost btn-sm add-set-btn" data-action="add-set" data-block="${b.id}">+ Add Set</button>
    </div>
  `;
}

/* ==================== HISTORY DETAIL ==================== */
function renderDetail(){
  const w = state.workouts.find(x=>x.id===state.detailId);
  if(!w){ state.route="history"; return renderHistoryTab(); }
  const d = new Date(w.finishedAt);
  const dateStr = d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"});
  const durMin = w.startedAt ? Math.max(1, Math.round((new Date(w.finishedAt)-new Date(w.startedAt))/60000)) : null;

  const groups = [];
  w.blocks.forEach(b=>{
    const last = groups[groups.length-1];
    if(b.supersetId && last && last.supersetId===b.supersetId) last.blocks.push(b);
    else groups.push({supersetId:b.supersetId, blocks:[b]});
  });

  const content = groups.map(g=>{
    const inner = g.blocks.map(b=>{
      const ex = findExercise(b.exerciseId);
      const lines = b.sets.filter(s=>s.weight!==""||s.reps!=="").map((s,i)=>`
        <div class="detail-set-line"><span>Set ${i+1}</span><span>${escHtml(s.weight)||'-'} &times; ${escHtml(s.reps)||'-'}</span></div>
      `).join("") || `<div class="detail-set-line"><span style="color:var(--muted)">No sets logged</span></div>`;
      return `
        <div class="block">
          <div class="ex-head"><div><div class="ex-name">${ex.name}</div><div class="ex-tag">${ex.category} &middot; ${ex.equipment}</div></div></div>
          <div class="sets-table">${lines}</div>
        </div>`;
    }).join("");
    if(g.supersetId) return `<div class="superset-wrap"><div class="superset-label">&#9889; Superset</div>${inner}</div>`;
    return inner;
  }).join("");

  return `
    <div class="appbar">
      <div class="icon-btn" data-action="back-history">&larr;</div>
      <div class="icon-btn danger" data-action="delete-workout" data-id="${w.id}" title="Delete">&times;</div>
    </div>
    <div class="screen">
      <div class="section-title" style="margin-top:0;">${dateStr}</div>
      <div style="color:var(--muted); font-size:13px; margin-bottom:16px;">
        ${w.blocks.length} exercise${w.blocks.length===1?"":"s"}${durMin?` &middot; ${durMin} min`:""}
      </div>
      ${content}
    </div>
  `;
}

/* ==================== EXERCISE PICKER ==================== */
function buildPickerRows(){
  const p = state.picker;
  const q = p.search.trim().toLowerCase();
  let list = EXERCISES.filter(ex=>{
    const matchesCat = p.category==="All" || ex.category===p.category;
    if(!matchesCat) return false;
    if(!q) return true;
    return ex.name.toLowerCase().includes(q) || ex.category.toLowerCase().includes(q) || ex.equipment.toLowerCase().includes(q);
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const addedIds = new Set((state.active? state.active.blocks: []).map(b=>b.exerciseId));

  return list.length ? list.map(ex=>{
    const pending = p.pendingSelection.includes(ex.id);
    const isSelected = p.supersetMode ? pending : (pending || addedIds.has(ex.id));
    const rightHtml = p.supersetMode
      ? `<div class="ex-row-check ${pending?'selected':''}">&#10003;</div>`
      : (isSelected ? `<div class="ex-row-added">Added</div>` : "");
    return `
      <div class="ex-row ${isSelected?'selected':''}" data-action="pick-exercise" data-id="${ex.id}">
        <div>
          <div class="ex-row-name">${ex.name}</div>
          <div class="ex-row-sub">${ex.category} &middot; ${ex.equipment}</div>
        </div>
        ${rightHtml}
      </div>`;
  }).join("") : `<div class="ex-empty">No exercises match your search.</div>`;
}

function buildPickerFooter(){
  const p = state.picker;
  if(p.supersetMode){
    return p.pendingSelection.length>=2
      ? `<div class="sheet-footer"><button class="btn btn-primary" data-action="confirm-superset">Group as Superset (${p.pendingSelection.length})</button></div>`
      : `<div class="sheet-footer"><button class="btn btn-secondary" disabled style="opacity:.5;">Select 2+ exercises to group</button></div>`;
  }
  return p.pendingSelection.length>0
    ? `<div class="sheet-footer"><button class="btn btn-primary" data-action="confirm-add-exercises">Add (${p.pendingSelection.length})</button></div>`
    : `<div class="sheet-footer"><button class="btn btn-secondary" disabled style="opacity:.5;">Select exercises to add</button></div>`;
}

function renderPicker(){
  const p = state.picker;
  const chips = CATEGORIES.map(c=>`<div class="chip ${p.category===c?'active':''}" data-action="pick-category" data-cat="${c}">${c}</div>`).join("");

  return `
    <div class="sheet-backdrop">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
          <div class="sheet-title-row">
            <h2>Add Exercise</h2>
            <div style="display:flex; align-items:center; gap:14px;">
              <button class="btn btn-secondary btn-sm" data-action="open-new-exercise">+ New</button>
              <div class="icon-btn" data-action="close-picker">&times;</div>
            </div>
          </div>
          <div class="search-box">
            <span class="sicon">&#9906;</span>
            <input id="picker-search" type="text" placeholder="Search exercises..." value="${escAttr(p.search)}" data-action="search-input" autocomplete="off" />
          </div>
          <div class="chip-row">${chips}</div>
          <div class="superset-toggle ${p.supersetMode?'on':''}" data-action="toggle-superset-mode">
            <div class="sw"></div>
            <span>Superset mode ${p.supersetMode? '&mdash; tap exercises to group them' : ''}</span>
          </div>
        </div>
        <div class="ex-list" id="picker-ex-list">${buildPickerRows()}</div>
        <div id="picker-footer">${buildPickerFooter()}</div>
      </div>
    </div>
  `;
}

/* ==================== CONFIRM MODAL ==================== */
// Custom in-app confirm dialog. window.confirm() is a silent no-op in iOS
// home-screen (standalone) PWAs, which is why the Finish button looked dead.
function renderConfirmModal(){
  const c = state.confirm;
  return `
    <div class="confirm-backdrop" data-action="confirm-no">
      <div class="confirm-box" onclick="event.stopPropagation()">
        <div class="confirm-msg">${escHtml(c.message)}</div>
        <div class="confirm-actions">
          <button class="btn btn-secondary" data-action="confirm-no">Cancel</button>
          <button class="btn ${c.danger ? 'btn-danger' : 'btn-primary'}" data-action="confirm-yes">${escHtml(c.confirmLabel)}</button>
        </div>
      </div>
    </div>
  `;
}
function showConfirm(message, onConfirm, opts={}){
  state.confirm = {message, onConfirm, confirmLabel: opts.confirmLabel || "Confirm", danger: !!opts.danger};
  render();
}

function buildTemplateRows(){
  const t = state.newTemplate;
  const q = t.search.trim().toLowerCase();
  let list = EXERCISES.filter(ex=>{
    const matchesCat = t.category==="All" || ex.category===t.category;
    if(!matchesCat) return false;
    if(!q) return true;
    return ex.name.toLowerCase().includes(q) || ex.category.toLowerCase().includes(q) || ex.equipment.toLowerCase().includes(q);
  }).sort((a,b)=>a.name.localeCompare(b.name));

  return list.length ? list.map(ex=>{
    const selected = t.selected.includes(ex.id);
    return `
      <div class="ex-row" data-action="toggle-template-exercise" data-id="${ex.id}">
        <div>
          <div class="ex-row-name">${ex.name}</div>
          <div class="ex-row-sub">${ex.category} &middot; ${ex.equipment}</div>
        </div>
        <div class="ex-row-check ${selected?'selected':''}">&#10003;</div>
      </div>`;
  }).join("") : `<div class="ex-empty">No exercises match your search.</div>`;
}

function buildTemplateFooter(){
  const t = state.newTemplate;
  const label = t.editIdx!=null ? "Save Changes" : "Create Template";
  return `<button class="btn btn-primary" data-action="save-new-template">${label}${t.selected.length ? ' (' + t.selected.length + ')' : ''}</button>`;
}

function renderNewTemplateModal(){
  const t = state.newTemplate;
  const chips = CATEGORIES.map(c=>`<div class="chip ${t.category===c?'active':''}" data-action="newtpl-category" data-cat="${c}">${c}</div>`).join("");

  return `
    <div class="sheet-backdrop">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
          <div class="sheet-title-row">
            <h2>${t.editIdx!=null ? "Edit Template" : "New Template"}</h2>
            <div class="icon-btn" data-action="close-new-template">&times;</div>
          </div>
          <div class="form-field" style="margin-bottom:10px;">
            <input id="newtpl-name" type="text" placeholder="Template name (e.g. Push Day)" value="${escAttr(t.name)}" autocomplete="off" />
          </div>
          <div class="search-box">
            <span class="sicon">&#9906;</span>
            <input id="newtpl-search" type="text" placeholder="Search exercises..." value="${escAttr(t.search)}" data-action="newtpl-search-input" autocomplete="off" />
          </div>
          <div class="chip-row">${chips}</div>
        </div>
        <div class="ex-list" id="newtpl-ex-list">${buildTemplateRows()}</div>
        <div class="sheet-footer" id="newtpl-footer">${buildTemplateFooter()}</div>
      </div>
    </div>
  `;
}

/* ==================== HELPERS ==================== */
function escHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escAttr(s){ return escHtml(s); }

function newSet(prevWeight, prevReps){
  return {id:uid(), weight: prevWeight??"", reps: prevReps??"", done:false};
}

/* ==================== ACTIONS ==================== */
function startWorkout(){
  if(state.active){ state.route="workout"; render(); return; }
  state.active = {id:uid(), startedAt:new Date().toISOString(), finishedAt:null, blocks:[]};
  saveActive(state.active);
  state.route="workout";
  render();
}

function startWorkoutFromTemplate(idx){
  if(state.active){ state.route="workout"; render(); showToast("Resuming workout in progress"); return; }
  const t = TEMPLATES[idx];
  state.active = {
    id:uid(), startedAt:new Date().toISOString(), finishedAt:null,
    blocks: t.exerciseIds.map(exId=>({id:uid(), supersetId:null, exerciseId:exId, sets:[newSet()]}))
  };
  saveActive(state.active);
  state.route="workout";
  render();
}

function discardWorkout(){
  showConfirm("Discard this workout? All unsaved sets will be lost.", doDiscardWorkout, {confirmLabel:"Discard", danger:true});
}
function doDiscardWorkout(){
  state.active = null;
  saveActive(null);
  state.route="start";
  render();
}

function finishWorkout(){
  const empty = state.active.blocks.length===0;
  const msg = empty
    ? "No exercises have been added to this workout. Finish anyway?"
    : "Finish and save this workout?";
  showConfirm(msg, doFinishWorkout, {confirmLabel:"Finish"});
}
function doFinishWorkout(){
  state.active.finishedAt = new Date().toISOString();
  state.workouts.push(state.active);
  saveWorkouts(state.workouts);
  state.active = null;
  saveActive(null);
  state.route="history";
  render();
  showToast("Workout saved");
}

function deleteWorkout(id){
  showConfirm("Delete this workout from history? This can't be undone.", ()=>doDeleteWorkout(id), {confirmLabel:"Delete", danger:true});
}
function doDeleteWorkout(id){
  state.workouts = state.workouts.filter(w=>w.id!==id);
  saveWorkouts(state.workouts);
  if(state.route==="detail") state.route="history";
  render();
}

function openPicker(){
  state.picker = {open:true, search:"", category:"All", supersetMode:false, pendingSelection:[]};
  render();
  const inp = document.getElementById("picker-search");
  if(inp) inp.focus();
}
function closePicker(){
  state.picker.open=false;
  render();
}

function openNewExerciseModal(){
  state.newExerciseOpen = true;
  render();
  const inp = document.getElementById("newex-name");
  if(inp) inp.focus();
}

function submitNewExercise(){
  const nameInp = document.getElementById("newex-name");
  const catSel = document.getElementById("newex-category");
  const equipSel = document.getElementById("newex-equipment");
  const name = nameInp.value.trim();
  if(!name){ showToast("Enter an exercise name"); nameInp.focus(); return; }
  if(!catSel.value){ showToast("Choose a category"); catSel.focus(); return; }
  if(!equipSel.value){ showToast("Choose an equipment type"); equipSel.focus(); return; }
  addCustomExercise(name, catSel.value, equipSel.value);
  state.newExerciseOpen = false;
  render();
  showToast(name + " added");
}

function openNewTemplateModal(){
  state.newTemplate = {name:"", search:"", category:"All", selected:[], editIdx:null};
  render();
  const inp = document.getElementById("newtpl-name");
  if(inp) inp.focus();
}

function openEditTemplateModal(idx){
  const t = TEMPLATES[idx];
  state.newTemplate = {name:t.name, search:"", category:"All", selected:t.exerciseIds.slice(), editIdx:idx};
  render();
  const inp = document.getElementById("newtpl-name");
  if(inp) inp.focus();
}

function toggleTemplateExerciseSelection(exId){
  const t = state.newTemplate;
  const idx = t.selected.indexOf(exId);
  if(idx>=0) t.selected.splice(idx,1);
  else t.selected.push(exId);
  patchList("newtpl-ex-list", buildTemplateRows);
  patchHtml("newtpl-footer", buildTemplateFooter);
}

function submitNewTemplate(){
  const t = state.newTemplate;
  const nameInp = document.getElementById("newtpl-name");
  const name = nameInp.value.trim();
  if(!name){ showToast("Enter a template name"); nameInp.focus(); return; }
  if(t.selected.length===0){ showToast("Select at least 1 exercise"); return; }
  if(t.editIdx!=null){
    const tpl = TEMPLATES[t.editIdx];
    tpl.name = name;
    tpl.exerciseIds = t.selected.slice();
    saveCustomTemplates();
    showToast(name + " template updated");
  } else {
    addCustomTemplate(name, t.selected.slice());
    showToast(name + " template created");
  }
  state.newTemplate = null;
  render();
}

function toggleExerciseSelection(exId){
  const p = state.picker;
  const idx = p.pendingSelection.indexOf(exId);
  if(idx>=0){
    p.pendingSelection.splice(idx,1);
  } else {
    const existingBlock = state.active.blocks.find(b=>b.exerciseId===exId);
    if(existingBlock && existingBlock.supersetId){
      showToast("Remove it from the superset on the workout screen");
      return;
    } else if(existingBlock){
      state.active.blocks = state.active.blocks.filter(b=>b!==existingBlock);
      saveActive(state.active);
      showToast(findExercise(exId).name + " removed");
    } else {
      p.pendingSelection.push(exId);
    }
  }
  patchList("picker-ex-list", buildPickerRows);
  patchHtml("picker-footer", buildPickerFooter);
}

function confirmAddExercises(){
  const p = state.picker;
  if(p.pendingSelection.length===0) return;
  p.pendingSelection.forEach(exId=>{
    state.active.blocks.push({id:uid(), supersetId:null, exerciseId:exId, sets:[newSet()]});
  });
  saveActive(state.active);
  showToast(p.pendingSelection.length + (p.pendingSelection.length===1 ? " exercise added" : " exercises added"));
  p.pendingSelection = [];
  patchList("picker-ex-list", buildPickerRows);
  patchHtml("picker-footer", buildPickerFooter);
}

function togglePendingSelection(exId){
  const p = state.picker;
  const idx = p.pendingSelection.indexOf(exId);
  if(idx>=0) p.pendingSelection.splice(idx,1);
  else p.pendingSelection.push(exId);
  patchList("picker-ex-list", buildPickerRows);
  patchHtml("picker-footer", buildPickerFooter);
}

function confirmSuperset(){
  const p = state.picker;
  if(p.pendingSelection.length<2) return;
  const supersetId = uid();
  p.pendingSelection.forEach(exId=>{
    state.active.blocks.push({id:uid(), supersetId, exerciseId:exId, sets:[newSet()]});
  });
  saveActive(state.active);
  showToast("Superset added (" + p.pendingSelection.length + " exercises)");
  p.pendingSelection = [];
  p.supersetMode = false;
  render();
}

function removeBlock(blockId){
  state.active.blocks = state.active.blocks.filter(b=>b.id!==blockId);
  saveActive(state.active);
  render();
}

function addSet(blockId){
  const b = state.active.blocks.find(x=>x.id===blockId);
  const last = b.sets[b.sets.length-1];
  b.sets.push(newSet(last?last.weight:"", last?last.reps:""));
  saveActive(state.active);
  render();
}

function deleteSet(blockId, setId){
  const b = state.active.blocks.find(x=>x.id===blockId);
  b.sets = b.sets.filter(s=>s.id!==setId);
  if(b.sets.length===0) b.sets.push(newSet());
  saveActive(state.active);
  render();
}

function updateSetField(blockId, setId, field, value){
  const b = state.active.blocks.find(x=>x.id===blockId);
  const s = b.sets.find(x=>x.id===setId);
  s[field] = value;
  saveActive(state.active);
}

function toggleDone(blockId, setId){
  const b = state.active.blocks.find(x=>x.id===blockId);
  const s = b.sets.find(x=>x.id===setId);
  s.done = !s.done;
  saveActive(state.active);
  render();
}

/* ==================== TIMER ==================== */
let timerInterval=null;
function startTimerLoop(){
  stopTimerLoop();
  updateTimerDisplay();
  timerInterval = setInterval(updateTimerDisplay, 1000);
}
function stopTimerLoop(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
}
function updateTimerDisplay(){
  const el = document.getElementById("workout-timer");
  if(!el || !state.active) return;
  const secs = Math.max(0, Math.floor((Date.now() - new Date(state.active.startedAt).getTime())/1000));
  const m = Math.floor(secs/60), s = secs%60;
  el.textContent = m + ":" + String(s).padStart(2,"0");
}

/* ==================== EVENT BINDING ==================== */
function bindEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.getAttribute("data-action");
    if(action==="set-weight" || action==="set-reps" || action==="search-input" || action==="exbrowse-search-input" || action==="newtpl-search-input") return; // handled via input listener
    el.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      handleAction(action, el);
    });
  });

  app.querySelectorAll('input[data-action="set-weight"]').forEach(inp=>{
    inp.addEventListener("input", ()=> updateSetField(inp.dataset.block, inp.dataset.set, "weight", inp.value));
  });
  app.querySelectorAll('input[data-action="set-reps"]').forEach(inp=>{
    inp.addEventListener("input", ()=> updateSetField(inp.dataset.block, inp.dataset.set, "reps", inp.value));
  });

  // Search inputs patch only their results list in place (not a full render()) so the
  // input never gets recreated/refocused while typing — that refocus-on-every-keystroke
  // was what made the page appear to jump/bounce as you typed.
  const searchInp = document.getElementById("picker-search");
  if(searchInp){
    searchInp.addEventListener("input", ()=>{
      state.picker.search = searchInp.value;
      patchList("picker-ex-list", buildPickerRows);
    });
  }

  const exSearchInp = document.getElementById("exbrowse-search");
  if(exSearchInp){
    exSearchInp.addEventListener("input", ()=>{
      state.exBrowse.search = exSearchInp.value;
      patchList("exbrowse-list", buildExBrowseRows);
    });
  }

  const newTplNameInp = document.getElementById("newtpl-name");
  if(newTplNameInp){
    newTplNameInp.addEventListener("input", ()=>{ state.newTemplate.name = newTplNameInp.value; });
  }
  const newTplSearchInp = document.getElementById("newtpl-search");
  if(newTplSearchInp){
    newTplSearchInp.addEventListener("input", ()=>{
      state.newTemplate.search = newTplSearchInp.value;
      patchList("newtpl-ex-list", buildTemplateRows);
    });
  }
}

function bindActionsWithin(container){
  container.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      handleAction(el.getAttribute("data-action"), el);
    });
  });
}

function patchList(containerId, buildRowsFn){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = buildRowsFn();
  bindActionsWithin(el);
}

function patchHtml(containerId, buildHtmlFn){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = buildHtmlFn();
  bindActionsWithin(el);
}

function handleAction(action, el){
  switch(action){
    case "start-workout": startWorkout(); break;
    case "resume-workout": state.route="workout"; render(); break;
    case "discard-workout": discardWorkout(); break;
    case "finish-workout": finishWorkout(); break;
    case "view-detail": state.detailId = el.dataset.id; state.route="detail"; render(); break;
    case "back-history": state.route="history"; render(); break;
    case "delete-workout": deleteWorkout(el.dataset.id); break;
    case "nav-tab": state.route = el.dataset.tab; render(); break;
    case "view-template": state.tplDetailIdx = parseInt(el.dataset.idx,10); state.route="tpldetail"; render(); break;
    case "edit-template": openEditTemplateModal(parseInt(el.dataset.idx,10)); break;
    case "back-to-start": state.route="start"; render(); break;
    case "start-template": startWorkoutFromTemplate(parseInt(el.dataset.idx,10)); break;
    case "view-exercise": state.exDetailId = el.dataset.id; state.route="exdetail"; render(); break;
    case "back-exercises": state.route="exercises"; render(); break;
    case "exbrowse-category": state.exBrowse.category = el.dataset.cat; render(); break;
    case "open-new-exercise": openNewExerciseModal(); break;
    case "close-new-exercise": state.newExerciseOpen = false; render(); break;
    case "save-new-exercise": submitNewExercise(); break;
    case "open-new-template": openNewTemplateModal(); break;
    case "close-new-template": state.newTemplate = null; render(); break;
    case "newtpl-category": state.newTemplate.category = el.dataset.cat; render(); break;
    case "toggle-template-exercise": toggleTemplateExerciseSelection(el.dataset.id); break;
    case "save-new-template": submitNewTemplate(); break;
    case "open-picker": openPicker(); break;
    case "close-picker": closePicker(); break;
    case "pick-category": state.picker.category = el.dataset.cat; render(); break;
    case "toggle-superset-mode":
      state.picker.supersetMode = !state.picker.supersetMode;
      state.picker.pendingSelection = [];
      render();
      break;
    case "pick-exercise":
      if(state.picker.supersetMode) togglePendingSelection(el.dataset.id);
      else toggleExerciseSelection(el.dataset.id);
      break;
    case "confirm-superset": confirmSuperset(); break;
    case "confirm-add-exercises": confirmAddExercises(); break;
    case "remove-block": removeBlock(el.dataset.block); break;
    case "add-set": addSet(el.dataset.block); break;
    case "delete-set": deleteSet(el.dataset.block, el.dataset.set); break;
    case "toggle-done": toggleDone(el.dataset.block, el.dataset.set); break;
    case "confirm-yes": { const cb = state.confirm.onConfirm; state.confirm = null; cb(); break; }
    case "confirm-no": state.confirm = null; render(); break;
  }
}
/* ==================== INIT ==================== */
if(state.active) state.route="workout";
render();
</script>
</body>
</html>
